<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/assets/icons/admin/favicon.ico?v=3" sizes="32x32">
<link rel="icon" href="/assets/icons/admin/icon.svg?v=3" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/icons/admin/apple-touch-icon.png?v=3">
<link rel="manifest" href="/assets/icons/admin/site.webmanifest?v=4">
<title>QuizFlow Admin — Для всіх</title>
<!-- Прев'ю посилання в месенджерах (картинки: у репозиторії quizflow, cd tests && npm run og) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="QuizFlow">
<meta property="og:locale" content="uk_UA">
<meta property="og:title" content="Адмін-панель · QuizFlow">
<meta property="og:description" content="Лише для адміністраторів QuizFlow.">
<meta property="og:image" content="https://admin.quizflow.space/assets/og/admin.jpg?v=1">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Адмін-панель QuizFlow">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Адмін-панель · QuizFlow">
<meta name="twitter:description" content="Лише для адміністраторів QuizFlow.">
<meta name="twitter:image" content="https://admin.quizflow.space/assets/og/admin.jpg?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="shared/admin-shell.css?v=19">
<style>

.fx-card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.fx-h{display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--line)}
.fx-h .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--v-100);color:var(--v-600);flex:0 0 auto}
.fx-h .ic svg{width:20px;height:20px}
.fx-h h2{font-size:16px;font-weight:800;margin:0}
.fx-h p{font-size:13px;color:var(--ink-500);margin:3px 0 0}
.fx-b{padding:18px 22px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.fx-sub{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-400);margin-bottom:8px}
.fx-list{display:flex;flex-direction:column;gap:8px}
.fx-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--sf-1);min-height:58px}
.fx-row .i{flex:1;min-width:0}
.fx-row b{display:block;font-size:14px;color:var(--ink-900)}
.fx-row span.d{font-size:12px;color:var(--ink-500)}
.fx-num{width:130px;flex:0 0 auto;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font:600 14px "Geist Mono",monospace;color:var(--ink-900);outline:none;text-align:right}
.fx-num::placeholder{font:600 13px "Manrope",sans-serif;color:var(--ink-400);text-align:right}
.fx-num:focus{border-color:var(--v-500);box-shadow:0 0 0 3px rgba(124,58,237,.12)}
.fx-num::-webkit-inner-spin-button{opacity:.5}

/* Ролі */
.fx-roles{display:flex;flex-direction:column}
.fx-role{--rc:var(--v-500);display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;padding:16px 22px;border-top:1px solid var(--line)}
.fx-role:first-child{border-top:0}
.fx-rn{display:flex;align-items:flex-start;gap:10px;min-width:0}
.fx-rn i{width:12px;height:12px;border-radius:4px;background:var(--rc);margin-top:4px;flex:0 0 auto}
.fx-rn b{display:block;font-size:14px;color:var(--ink-900);overflow:hidden;text-overflow:ellipsis}
.fx-rn span{font-size:12px;color:var(--ink-400);font-weight:600}
.fx-rn .mod{display:inline-block;margin-top:6px;font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--amb-100);color:var(--amb-700)}
.fx-rc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fx-cell{display:flex;flex-direction:column;gap:6px;min-width:0}
.fx-cell label,.fx-cell .l{font-size:12px;font-weight:700;color:var(--ink-700)}
.tri{display:inline-flex;padding:3px;border-radius:10px;background:var(--sf-2);gap:2px}
.tri button{border:0;background:transparent;padding:6px 9px;border-radius:8px;font:700 12px "Manrope",sans-serif;color:var(--ink-500);cursor:pointer;white-space:nowrap}
.tri button.on{background:#fff;color:var(--ink-900);box-shadow:0 1px 3px rgba(15,30,71,.12)}
.tri button.on[data-v="1"]{color:var(--grn-700)}
.tri button.on[data-v="0"]{color:var(--red-700)}
.fx-cell .fx-num{width:100%;text-align:left}
.fx-cell .fx-num::placeholder{text-align:left}
.fx-rl{text-decoration:none;color:inherit;align-items:center;transition:background .12s}
.fx-rl:hover{background:var(--sf-1)}
.fx-rl:focus-visible{outline:2px solid var(--v-500);outline-offset:-2px}
.fx-rs{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;color:var(--ink-500)}
.fx-warn{margin-top:14px;padding:11px 14px;border-radius:12px;background:#FFF7ED;border:1px solid #FDE4BC;color:#9A3412;font-size:13px;line-height:1.55}
.fx-warn ul{margin:4px 0 0;padding-left:18px}
.fx-empty{padding:26px 22px;text-align:center;font-size:13px;color:var(--ink-500)}
.fx-empty a{color:var(--v-600);font-weight:700}

.fx-how{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(135deg,var(--v-50),#EEF2FF);border:1px solid #E0DAFE;border-radius:16px;padding:14px 16px;font-size:13px;color:var(--ink-700);line-height:1.55}
.fx-how svg{flex:0 0 auto;width:18px;height:18px;color:var(--v-600);margin-top:1px}
.fx-how b{color:var(--ink-900)}

.save-bar{position:sticky;bottom:16px;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 14px 12px 18px;border-radius:14px;background:#1A1040;color:#fff;box-shadow:0 18px 40px -12px rgba(20,11,58,.55);transform:translateY(calc(100% + 30px));opacity:0;pointer-events:none;transition:transform .25s cubic-bezier(.32,.72,0,1),opacity .2s}

@media (max-width:1180px){ .fx-b{grid-template-columns:1fr} .fx-role{grid-template-columns:1fr;gap:12px} }
@media (max-width:760px){ .fx-rc{grid-template-columns:1fr} .fx-row{flex-wrap:wrap} .fx-num{width:100%;text-align:left} .fx-num::placeholder{text-align:left} .fx-h{padding:16px} .fx-b{padding:16px} .fx-role{padding:16px} }
</style>
<!-- Модулі вантажимо одразу, паралельно зі стилями й шрифтами, а не після розбору всієї сторінки -->
<link rel="modulepreload" href="shared/admin-shell.js?v=21">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js">
</head>
<body>

<div id="admin-loader"><div class="spin"></div></div>
<script src="shared/admin-nav.js?v=12"></script>
<div id="admin-root"></div>
<div id="admin-toast" class="toast" role="status" aria-live="polite"></div>

<script type="module">
import { logAction, initAdminShell, db, ref, update, dbGet, toast, esc, hideLoader } from "./shared/admin-shell.js?v=21";
import { CAP_LIMITS } from "./shared/caps.js?v=4";
import { PERMS, GROUPS, normalizeCfg, resolvePerms, conflicts } from "./shared/perms.js?v=2";
import { buildSave } from "./shared/perms-store.js?v=1";
import { syncPerms } from "./shared/perms-sync.js?v=1";

const SVG = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC = {
  all: SVG('<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M15 20c0-2.6 2-4.8 4.5-5"/>'),
  roles: SVG('<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>'),
  info: SVG('<circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="7.8" r=".6" fill="currentColor"/>'),
};
const plural = (n, f) => { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? f[2] : b === 1 ? f[0] : b >= 2 && b <= 4 ? f[1] : f[2]; };

const content = `
  <div class="page-head"><div><h1>Базові дозволи й ліміти</h1><p>Базові дозволи й ліміти. Ролі та особисті налаштування можуть їх змінити</p></div></div>
  <div class="fx-how">${IC.info}<span><b>Як це працює.</b> Спершу діють особисті налаштування викладача, потім його ролі, і лише потім ці. Якщо хоча б одна роль дозволяє, дія доступна. Серед лімітів ролей діє найбільший. Адміністраторів ці обмеження не стосуються.</span></div>
  <section class="fx-card" id="fx-all"></section>
  <section class="fx-card" id="fx-roles"></section>
  <div class="save-bar" id="save-bar" role="region" aria-label="Незбережені зміни">
    <span class="t">Є незбережені зміни</span>
    <button type="button" class="tb-btn ghost" id="btn-discard">Скасувати</button>
    <button type="button" class="tb-btn primary" id="btn-save">Зберегти</button>
  </div>
`;
await initAdminShell({ activeId: "features", crumbs: ["Для всіх"], content });

let feat = {}, navRaw = null, navFromDb = false, roles = {}, users = {};
let cur = { perms: {}, limits: {} }, saved = "";
const ser = c => JSON.stringify({ p: Object.keys(c.perms).filter(k => c.perms[k] === false).sort(), l: Object.fromEntries(Object.entries(c.limits).filter(([, v]) => Number(v) > 0).map(([k, v]) => [k, Math.floor(Number(v))])) });
const dirty = () => ser(cur) !== saved;
const syncBar = () => document.getElementById("save-bar").classList.toggle("on", dirty());
const fromRaw = () => { const n = normalizeCfg(feat, navRaw); cur = { perms: { ...n.perms }, limits: { ...n.limits } }; saved = ser(cur); };

function renderAll(){
  const eff = resolvePerms({ v: 2, perms: cur.perms }, { role: "teacher" }).perms;
  const warn = conflicts(eff);
  document.getElementById("fx-all").innerHTML = `
    <div class="fx-h"><span class="ic">${IC.all}</span><div><h2>Що дозволено всім</h2><p>Вимкніть, щоб дія була доступна лише ролям і людям, яким її дозволили окремо</p></div></div>
    <div class="fx-b">
      <div>${GROUPS.map(g => `<div class="fx-sub">${esc(g.label)}</div><div class="fx-list" style="margin-bottom:14px">${Object.keys(PERMS).filter(k => PERMS[k].group === g.id).map(k => `<label class="fx-row"><span class="i"><b>${esc(PERMS[k].label)}</b><span class="d">${esc(PERMS[k].desc)}</span></span>
        <span class="toggle-sw"><input type="checkbox" data-pk="${esc(k)}" ${cur.perms[k] !== false ? "checked" : ""} aria-label="${esc(PERMS[k].label)}"><span class="toggle-sl"></span></span></label>`).join("")}</div>`).join("")}</div>
      <div><div class="fx-sub">Ліміти</div><div class="fx-list">${Object.entries(CAP_LIMITS).map(([k, f]) => `<div class="fx-row"><span class="i"><b>${f.label}</b><span class="d">${f.desc}</span></span>
        <input class="fx-num" type="number" min="0" step="1" inputmode="numeric" data-lim="${k}" value="${Number(cur.limits[k]) > 0 ? Number(cur.limits[k]) : ""}" placeholder="Без обмежень" aria-label="${f.label}"></div>`).join("")}</div>
        ${warn.length ? `<div class="fx-warn" role="alert"><b>Перевірте налаштування</b><ul>${warn.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>` : ""}</div>
    </div>`;
  const rids = Object.keys(roles).sort((a, b) => (roles[a].name || "").localeCompare(roles[b].name || "", "uk"));
  const n = normalizeCfg(feat, navRaw);
  const members = rid => Object.values(users).filter(u => u && ((u.customRoleIds && u.customRoleIds[rid]) || u.customRoleId === rid)).length;
  document.getElementById("fx-roles").innerHTML = `
    <div class="fx-h"><span class="ic">${IC.roles}</span><div><h2>Ролі</h2><p>Дозволи й ліміти кожної ролі налаштовуються в самій ролі</p></div></div>
    ${rids.length ? `<div class="fx-roles">${rids.map(rid => { const r = n.roles[rid], m = members(rid);
      const ch = r ? Object.keys(r.perms || {}).length + Object.values(r.limits || {}).filter(v => v !== "" && v != null).length : 0;
      return `<a class="fx-role fx-rl" href="roles?id=${encodeURIComponent(rid)}" style="--rc:${esc(roles[rid].color || "#7C3AED")}">
        <div class="fx-rn"><i></i><div><b>${esc(roles[rid].name || "—")}</b><span>${m} ${plural(m, ["викладач", "викладачі", "викладачів"])}</span></div></div>
        <div class="fx-rs">${ch ? `${ch} ${plural(ch, ["налаштування", "налаштування", "налаштувань"])}` : "Нічого не змінює"}<span aria-hidden="true">›</span></div></a>`; }).join("")}</div>`
      : `<div class="fx-empty">Ролей ще немає. <a href="roles">Створіть роль</a>, щоб задавати окремі дозволи групам викладачів.</div>`}`;
  syncBar();
}

document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.pk){ if (t.checked) delete cur.perms[t.dataset.pk]; else cur.perms[t.dataset.pk] = false; renderAll(); document.querySelector(`[data-pk="${CSS.escape(t.dataset.pk)}"]`)?.focus(); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.lim){ cur.limits[t.dataset.lim] = t.value; syncBar(); }
});
document.getElementById("btn-discard").addEventListener("click", () => { fromRaw(); renderAll(); });
async function save(){
  const btn = document.getElementById("btn-save"); btn.disabled = true;
  try {
    const prev = JSON.parse(saved);
    const { upd, data, newNav } = buildSave(feat, navRaw, navFromDb, c => { c.perms = { ...cur.perms }; c.limits = { ...cur.limits }; }, id => !!roles[id]);
    await update(ref(db), upd);
    feat = data; if (newNav) navRaw = newNav;
    try { await syncPerms(null); } catch (e) { toast("Збережено, але сервер не оновив дозволи: " + e.message, "err"); }
    const now = JSON.parse(ser(cur)), diff = [];
    Object.keys(PERMS).forEach(k => { const was = !prev.p.includes(k), is = !now.p.includes(k); if (was !== is) diff.push(`${PERMS[k].label}: ${is ? "так" : "ні"}`); });
    Object.keys(CAP_LIMITS).forEach(k => { if ((prev.l[k] || 0) !== (now.l[k] || 0)) diff.push(`${CAP_LIMITS[k].label}: ${now.l[k] || "без обмежень"}`); });
    logAction("features.update", { type: "service", label: "Дозволи й ліміти для всіх" }, diff.join(", ") || null);
    fromRaw(); renderAll();
    toast("Збережено: викладачі отримають зміни при наступному відкритті сторінки");
  } catch (e) { toast("Помилка: " + e.message, "err"); }
  finally { btn.disabled = false; }
}
document.getElementById("btn-save").addEventListener("click", save);
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s" && dirty()){ e.preventDefault(); save(); } });
addEventListener("beforeunload", e => { if (dirty()){ e.preventDefault(); e.returnValue = ""; } });

try {
  const [f, r, u, n] = await Promise.all([dbGet("settings/features"), dbGet("roles").catch(() => null), dbGet("users").catch(() => null), dbGet("settings/navigation").catch(() => null)]);
  feat = f || {}; roles = r || {}; users = u || {}; navRaw = n || null;
  navFromDb = !!(n && (Array.isArray(n) ? n.length : Object.keys(n).length));
  fromRaw();
} catch (e) { toast("Не вдалося завантажити: " + e.message, "err"); }
renderAll();
hideLoader();
</script>
</body>
</html>
