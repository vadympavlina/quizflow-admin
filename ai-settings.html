<style>
.ai-sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 -4px}
.ai-sec-h h2{margin:0;font-size:16px;font-weight:800;letter-spacing:-.01em}
.ai-sec-h p{margin:2px 0 0;font-size:13px;color:var(--ink-500)}

/* Провайдери */
.row-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
/* Використання AI */
.us-months{display:flex;gap:6px;flex-wrap:wrap}
.us-months button{padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:#fff;font:700 13px "Manrope",sans-serif;color:var(--ink-500);cursor:pointer}
.us-months button:hover{border-color:var(--line-strong);color:var(--ink-900)}
.us-months button.on{background:var(--ink-900);border-color:var(--ink-900);color:#fff}
.us-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.us-kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.us-kpi .l{font-size:12px;font-weight:700;color:var(--ink-500);display:flex;align-items:center;gap:7px}
.us-kpi .l i{width:8px;height:8px;border-radius:2px}
.us-kpi .v{font:800 28px "Geist Mono",monospace;letter-spacing:-.02em;margin-top:6px;color:var(--ink-900)}
.us-kpi small{display:block;font-size:12px;font-weight:600;color:var(--ink-400);margin-top:3px}
.us-kpi small.bad{color:var(--red-700)}
.us-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.us-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
.us-card h3{font-size:14px;font-weight:800;margin:0 0 2px}
.us-card p.s{font-size:12px;color:var(--ink-500);margin:0 0 14px}
.us-empty{background:#fff;border:1px dashed var(--line-strong);border-radius:16px;padding:28px 20px;text-align:center;color:var(--ink-500);font-size:13px;line-height:1.55}
.us-empty b{display:block;font-size:14px;color:var(--ink-900);margin-bottom:4px}
@media (max-width:1180px){.us-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.us-grid{grid-template-columns:1fr}}
@media (max-width:1180px){.row-2{grid-template-columns:1fr}}
.prov{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px}
.prov-head{display:flex;align-items:center;gap:12px}
.prov-mark{width:44px;height:44px;border-radius:13px;flex:0 0 auto;display:grid;place-items:center;color:#fff}
.prov-mark.groq{background:linear-gradient(135deg,#F59E0B,#D97706);box-shadow:0 8px 18px -8px rgba(245,158,11,.6)}
.prov-mark.gemini{background:linear-gradient(135deg,#34D399,#059669);box-shadow:0 8px 18px -8px rgba(16,185,129,.6)}
.prov-name{font-weight:800;font-size:16px;letter-spacing:-.01em}
.prov-link{font-size:12px;color:var(--v-600);text-decoration:none;font-family:"Geist Mono",monospace;display:inline-flex;align-items:center;gap:4px;margin-top:2px}
.prov-link:hover{text-decoration:underline}
.prov-state{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--sf-2);color:var(--ink-500);white-space:nowrap}
.prov-state::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.prov-state.ok{background:var(--grn-100);color:var(--grn-700)}
.prov-state.set{background:var(--v-100);color:var(--v-600)}
.prov-state.bad{background:var(--red-100);color:var(--red-700)}
.prov-state.busy::before{animation:aiBlink .8s infinite}
@keyframes aiBlink{50%{opacity:.25}}

.lbl{font-size:11px;color:var(--ink-400);text-transform:uppercase;letter-spacing:.07em;font-weight:800;margin-bottom:7px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.lbl .hint{text-transform:none;letter-spacing:0;font-weight:600;font-size:12px;color:var(--ink-400)}

.models{display:flex;flex-direction:column;gap:6px}
.model{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;border:1.5px solid var(--line);cursor:pointer;transition:border-color .15s,background .15s;background:#fff}
.model:hover{border-color:var(--line-strong)}
.model:has(input:checked){border-color:var(--v-500);background:#F7F4FF}
.model:has(input:focus-visible){box-shadow:0 0 0 3px rgba(124,58,237,.18)}
.model input{accent-color:var(--v-500);margin:0;flex:0 0 auto;cursor:pointer}
.model .nm{font-weight:700;font-size:13px;font-family:"Geist Mono",monospace;color:var(--ink-900)}
.model:has(input:checked) .nm{color:var(--v-600)}
.model .desc{font-size:12px;color:var(--ink-500);margin-top:1px}
.model .tag{margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--grn-100);color:var(--grn-700);white-space:nowrap}
.model .tag.gray{background:var(--sf-2);color:var(--ink-500)}
.model-custom{display:flex;gap:8px;align-items:center}
.model-custom select,.model-custom input{flex:1;padding:9px 11px;border-radius:10px;border:1.5px solid var(--line);font:inherit;font-size:13px;font-family:"Geist Mono",monospace;background:#fff;color:var(--ink-900);outline:none;min-width:0}
.model-custom select:focus,.model-custom input:focus{border-color:var(--v-500)}

/* Функції */
.mainprov{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--ink-500)}
.mainprov .seg2{min-width:190px}
.pf-toggle{display:block;text-align:left;margin:10px 0 0;padding:6px 2px;border:0;background:none;font:700 13px "Manrope",sans-serif;color:var(--v-600);cursor:pointer}
.pf-toggle:hover{text-decoration:underline}
.feat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:1180px){.feat-grid{grid-template-columns:1fr}}
.feat{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;transition:border-color .15s,opacity .15s}
.feat.off{background:var(--sf-1)}
.feat.off .feat-body{opacity:.45;pointer-events:none}
.feat-h{display:flex;align-items:flex-start;gap:12px}
.feat-ico{width:38px;height:38px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center}
.feat-ico svg{width:18px;height:18px}
.feat-ico.violet{background:var(--v-100);color:var(--v-600)}.feat-ico.blue{background:#DBEAFE;color:#1D4ED8}
.feat-ico.amber{background:var(--amb-100);color:var(--amb-700)}.feat-ico.green{background:var(--grn-100);color:var(--grn-700)}
.feat-t{flex:1;min-width:0}
.feat-name{font-weight:800;font-size:14px}
.feat-desc{font-size:12px;color:var(--ink-500);margin-top:2px;line-height:1.4}
.feat-where{font-size:11px;color:var(--ink-400);margin-top:4px;font-family:"Geist Mono",monospace}
.feat-body{display:flex;flex-direction:column;gap:8px}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--sf-2);border-radius:10px;padding:3px;gap:3px}
.seg2 button{border:0;background:transparent;border-radius:8px;padding:8px;font:inherit;font-size:13px;font-weight:700;color:var(--ink-500);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,color .15s}
.seg2 button:hover{color:var(--ink-900)}
.seg2 button[aria-pressed="true"]{background:#fff;color:var(--ink-900);box-shadow:0 1px 3px rgba(15,30,71,.12)}
.seg2 .pdot{width:7px;height:7px;border-radius:50%}
.seg2 [data-prov="groq"] .pdot{background:#F59E0B}.seg2 [data-prov="gemini"] .pdot{background:#10B981}
.feat-note{font-size:12px;color:var(--amb-700);display:flex;gap:6px;align-items:flex-start;line-height:1.4}
.feat-note svg{flex:0 0 auto;width:13px;height:13px;margin-top:1px}
.feat-model{font-size:12px;color:var(--ink-400)}
.feat-model b{font-family:"Geist Mono",monospace;color:var(--ink-700);font-weight:600}

.toggle-sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.toggle-sl{position:absolute;inset:0;background:#DDE3EE;border-radius:99px;transition:background .2s}
.toggle-sl::before{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.toggle-sw input:focus-visible + .toggle-sl{box-shadow:0 0 0 3px rgba(124,58,237,.25)}

/* Індивідуальні перевизначення */
.ovr{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 18px}
.ovr-ico{width:38px;height:38px;border-radius:11px;background:var(--v-100);color:var(--v-600);display:grid;place-items:center;flex:0 0 auto}
.ovr-ico svg{width:19px;height:19px}
.ovr-t{flex:1;font-size:13px;color:var(--ink-700)}
.ovr-t b{color:var(--ink-900)}
.ovr-names{font-size:12px;color:var(--ink-500);margin-top:2px}
.ovr a{font-size:13px;font-weight:700;color:var(--v-600);text-decoration:none;white-space:nowrap}
.ovr a:hover{text-decoration:underline}


/* Панель незбережених змін */
.save-bar{position:sticky;bottom:16px;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 14px 12px 18px;border-radius:14px;background:#1A1040;color:#fff;box-shadow:0 18px 40px -12px rgba(20,11,58,.55);transform:translateY(calc(100% + 30px));opacity:0;pointer-events:none;transition:transform .25s cubic-bezier(.32,.72,0,1),opacity .2s}
.save-bar .k{font-size:12px;opacity:.6;font-family:"Geist Mono",monospace}
/* Телефон */
@media (max-width:640px){
  .prov{padding:16px;gap:14px}
  .prov-head{flex-wrap:wrap}
  .prov-state{margin-left:56px}
  .lbl{flex-wrap:wrap}
  .model{align-items:flex-start}
  .model .tag{margin-left:0}
  .model > div{flex:1;min-width:0}
  .ovr{flex-wrap:wrap}
  .save-bar{flex-wrap:wrap;bottom:10px}
  .save-bar .k{display:none}
}
.wk{margin:0 0 16px;padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:#fff}
.wk-h{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.wk-h b{font-size:16px;color:var(--ink-900)}
.wk-h p{margin:4px 0 0;font-size:13px;color:var(--ink-500);line-height:1.55;max-width:70ch}
.wk-h code{font:600 12px "Geist Mono",monospace;background:var(--sf-3);padding:1px 5px;border-radius:5px}
.wk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:12px}
.wk-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:10px;background:var(--sf-1);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-700)}
.wk-st{font-size:12px;font-weight:800;padding:3px 8px;border-radius:7px}
.wk-st.yes{background:var(--grn-50,#E9F8EF);color:var(--grn-700)}.wk-st.no{background:var(--amb-100);color:var(--amb-700)}
.wk-acts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.wk-msg{font-size:13px;color:var(--ink-500)}.wk-msg.ok{color:var(--grn-700)}.wk-msg.bad{color:var(--red-700)}
.wk-err{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--red-50);color:var(--red-700);font-size:13px;line-height:1.5}
.wk-note{margin-top:8px;font-size:12px;color:var(--ink-400)}
</style>
<!-- Модулі вантажимо одразу, паралельно зі стилями й шрифтами, а не після розбору всієї сторінки -->

<body>

<div id="admin-loader"><div class="spin"></div></div>
<script src="shared/admin-nav.js?v=12"></script>
<div id="admin-root"></div>
<div id="admin-modals"></div>
<div id="admin-toast" class="toast" role="status" aria-live="polite"></div>

<script type="module">
import { logAction, initAdminShell, dbGet, dbUpd, toast, esc, hideLoader, mailApi, mailWorkerUrl } from "./shared/admin-shell.js?v=22";

const SVG = (p, w = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC = {
  eye: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
  eyeOff: '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>',
  ext: '<path d="M14 4h6v6"/><path d="M20 4l-9 9"/>',
  warn: '<path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>',
  users: '<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M15 20c0-2.6 2-4.8 4.5-5"/>',
};

// Актуальні моделі. Збережена модель, якої немає в списку, не губиться — показується як «своя».
const PROVIDERS = {
  groq: {
    name: "Groq", link: "https://console.groq.com/keys", host: "console.groq.com", prefix: "gsk_", placeholder: "gsk_…",
    mark: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
    models: [
      { id: "llama-3.3-70b-versatile", desc: "Найкраща якість українською", tag: "Рекомендовано" },
      { id: "openai/gpt-oss-120b", desc: "Сильне міркування, довші відповіді" },
      { id: "llama-3.1-8b-instant", desc: "Найшвидша й найдешевша", tag: "Швидка" },
    ],
  },
  gemini: {
    name: "Google Gemini", link: "https://aistudio.google.com/apikey", host: "aistudio.google.com", prefix: "AIza", placeholder: "AIza…",
    mark: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/></svg>',
    models: [
      { id: "gemini-2.5-flash", desc: "Баланс швидкості та якості", tag: "Рекомендовано" },
      { id: "gemini-2.5-flash-lite", desc: "Найшвидша й найдешевша", tag: "Швидка" },
      { id: "gemini-2.5-pro", desc: "Найточніша, повільніша" },
    ],
  },
};
const FEATURES = [
  { id: "comments", flag: "aiComments", name: "Коментар студенту", desc: "Коротка оцінка й порада після проходження тесту", where: "сторінка тесту → результат", ico: "violet",
    svg: '<path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>' },
  { id: "analysis", flag: "aiAnalysis", name: "Персональний розбір помилок", desc: "Що саме не так і що повторити", where: "результат тесту · спроби викладача", ico: "blue",
    svg: '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>' },
  { id: "generation", flag: "aiGeneration", name: "Генерація питань", desc: "Створення та перефразування питань", where: "конструктор тестів", ico: "amber",
    svg: '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>' },
  { id: "textcheck", flag: "aiTextCheck", name: "Перевірка текстових відповідей", desc: "AI-оцінка відкритих і числових відповідей", where: "сторінка тесту → перевірка", ico: "green",
    svg: '<path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>' },
  { id: "mail", flag: "aiMail", name: "Листи й розсилки", desc: "Написання листів викладачам за описом адміністратора", where: "адмінка → розсилки", ico: "blue",
    svg: '<path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/>' },
];

const provCard = p => {
  const P = PROVIDERS[p];
  return `<section class="prov" data-prov="${p}">
    <div class="prov-head">
      <div class="prov-mark ${p}">${P.mark}</div>
      <div>
        <div class="prov-name">${P.name}</div>
        <a href="${P.link}" target="_blank" rel="noopener" class="prov-link">${P.host} ${SVG(IC.ext, 2.4).replace("<svg", '<svg width="9" height="9"')}</a>
      </div>
      <span class="prov-state" id="st-${p}">Не налаштовано</span>
    </div>
    <div>
      <div class="lbl"><span>Модель</span><span class="hint" id="mcount-${p}"></span></div>
      <div class="models" id="models-${p}" role="radiogroup" aria-label="Модель ${P.name}"></div>
    </div>
  </section>`;
};

const content = `
  <div class="page-head">
    <div>
      <h1>Штучний інтелект у сервісі</h1>
      <p>Моделі та функції штучного інтелекту для всієї платформи. Ключі зберігаються у воркері.</p>
    </div>
  </div>

  <div class="ai-sec-h"><div><h2>Функції</h2><p>Що вмикати для викладачів і студентів</p></div>
    <div class="mainprov"><span>Провайдер</span>
      <div class="seg2" id="main-prov" role="group" aria-label="Основний провайдер">${["groq", "gemini"].map(p => `<button type="button" data-main="${p}" aria-pressed="false"><span class="pdot"></span>${PROVIDERS[p].name.replace("Google ", "")}</button>`).join("")}</div>
    </div>
  </div>
  <div class="feat-grid" id="feat-grid"></div>
  <button type="button" class="pf-toggle" id="pf-toggle" aria-expanded="false">Свій провайдер для кожної функції</button>

  <div class="ai-sec-h"><div><h2>Моделі</h2><p>Достатньо одного провайдера. Якщо в основного немає ключа у воркері, функція використає інший.</p></div></div>
  <div class="row-2">${provCard("groq")}${provCard("gemini")}</div>

  <div class="ovr" id="ovr" hidden>
    <div class="ovr-ico">${SVG(IC.users)}</div>
    <div class="ovr-t"><div id="ovr-t"></div><div class="ovr-names" id="ovr-names"></div></div>
    <a href="teachers">До викладачів →</a>
  </div>

  <div class="ai-sec-h"><div><h2>Використання</h2><p>Скільки звернень до AI роблять викладачі та їхні студенти</p></div><div class="us-months" id="us-months" role="tablist" aria-label="Місяць"></div></div>
  <div id="ai-usage"><div class="us-empty">Завантаження…</div></div>

  <div class="save-bar" id="save-bar" role="region" aria-label="Незбережені зміни">

`;

const topbarRight = `
  <button class="tb-btn primary" id="btn-save-ai" type="button" disabled hidden>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
    Зберегти
  </button>`;

const { isOwner } = await initAdminShell({ activeId: "ai", crumbs: ["AI-налаштування"], content, topbarRight });

// ─── Стан ────────────────────────────────────────────────────────────────
const DEF = { groqModel: "llama-3.3-70b-versatile", geminiModel: "gemini-2.5-flash",
  flags: { comments: true, analysis: true, generation: true, textcheck: true, mail: true },
  prov: { comments: "groq", analysis: "groq", generation: "groq", textcheck: "groq", mail: "groq" } };
let saved = structuredClone(DEF), cur = structuredClone(DEF);
let perFeature = false;   // свій провайдер для кожної функції (відкрито, якщо вони вже різні)
const wk = { viaWorker: false, status: null, err: "", url: "" };   // ключі у воркері
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
// Ключі лежать у секретах воркера; поки статус не прийшов, вважаємо, що вони є
const hasKey = p => wk.status ? !!wk.status.configured[p] : true;

// ─── Рендер ──────────────────────────────────────────────────────────────
function renderModels(p){
  const P = PROVIDERS[p], sel = cur[p + "Model"];
  const known = P.models.map(m => m.id);
  const isCustom = sel && !known.includes(sel);
  document.getElementById("models-" + p).innerHTML = P.models.map(m => `
    <label class="model"><input type="radio" name="model-${p}" value="${esc(m.id)}" ${sel === m.id ? "checked" : ""}>
      <span><div class="nm">${esc(m.id)}</div><div class="desc">${esc(m.desc)}</div></span>
      ${m.tag ? `<span class="tag${m.tag === "Швидка" ? " gray" : ""}">${m.tag}</span>` : ""}</label>`).join("") + `
    <label class="model"><input type="radio" name="model-${p}" value="__custom" ${isCustom ? "checked" : ""}>
      <span style="flex:1;min-width:0"><div class="nm">Інша модель</div>
        <div class="model-custom" style="margin-top:6px">
          <input data-custom="${p}" placeholder="${p === "groq" ? "наприклад, qwen/qwen3-32b" : "наприклад, gemini-2.5-pro"}" value="${isCustom ? esc(sel) : ""}" aria-label="Назва моделі">
        </div></span></label>`;
  document.getElementById("mcount-" + p).textContent = "";
}

function renderProvState(p){
  const el = document.getElementById("st-" + p);
  el.className = "prov-state";
  if (!wk.status){ el.textContent = "Перевіряємо…"; el.classList.add("busy"); return; }
  const on = wk.status.configured[p];
  el.classList.add(on ? "ok" : "bad");
  el.textContent = on ? "Ключ у воркері" : "Немає ключа у воркері";
}

function renderFeatures(){
  document.getElementById("feat-grid").innerHTML = FEATURES.map(f => {
    const on = cur.flags[f.id], chosen = cur.prov[f.id];
    const other = chosen === "groq" ? "gemini" : "groq";
    const eff = hasKey(chosen) ? chosen : hasKey(other) ? other : null;
    const note = on && !hasKey(chosen)
      ? (eff ? `Немає ключа ${PROVIDERS[chosen].name} у воркері — буде використано ${PROVIDERS[eff].name}` : "У воркері немає жодного ключа — функція не працюватиме")
      : "";
    return `<article class="feat${on ? "" : " off"}" data-feat="${f.id}">
      <div class="feat-h">
        <div class="feat-ico ${f.ico}">${SVG(f.svg)}</div>
        <div class="feat-t"><div class="feat-name">${f.name}</div><div class="feat-desc">${f.desc}</div><div class="feat-where">${f.where}</div></div>
        <label class="toggle-sw" title="${on ? "Вимкнути" : "Увімкнути"}"><input type="checkbox" data-flag="${f.id}" ${on ? "checked" : ""} aria-label="${f.name}"><span class="toggle-sl"></span></label>
      </div>
      ${perFeature ? `<div class="feat-body">
        <div class="seg2" role="group" aria-label="Провайдер">
          ${["groq", "gemini"].map(p => `<button type="button" data-prov="${p}" aria-pressed="${chosen === p}"><span class="pdot"></span>${p === "groq" ? "Groq" : "Gemini"}</button>`).join("")}
        </div>
      </div>` : ""}
      ${note ? `<div class="feat-note">${SVG(IC.warn)}${note}</div>` : ""}
    </article>`;
  }).join("");
}

function renderMainProv(){
  const vals = new Set(Object.values(cur.prov));
  const main = vals.size === 1 ? [...vals][0] : "";
  document.querySelectorAll("#main-prov [data-main]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.main === main)));
  const t = document.getElementById("pf-toggle");
  t.textContent = perFeature ? "Один провайдер для всіх функцій" : "Свій провайдер для кожної функції";
  t.setAttribute("aria-expanded", String(perFeature));
  document.getElementById("main-prov").parentElement.hidden = false;
}
function renderDirty(){
  const dirty = !same(cur, saved);
  document.getElementById("save-bar").classList.toggle("on", dirty);
  { const b = document.getElementById("btn-save-ai"); b.disabled = !dirty; b.hidden = !dirty; }   // без змін кнопки не показуємо
}

function renderAll(){
  ["groq", "gemini"].forEach(p => { renderModels(p); renderProvState(p); });
  renderFeatures(); renderMainProv(); renderDirty();
}

// ─── Події ───────────────────────────────────────────────────────────────
const root = document.getElementById("admin-content");
root.addEventListener("input", e => {
  const t = e.target;
  if (t.matches("input[data-custom]")){
    const p = t.dataset.custom;
    document.querySelector(`input[name="model-${p}"][value="__custom"]`).checked = true;
    cur[p + "Model"] = t.value.trim();
    renderFeatures();
  }
  renderDirty();
});
root.addEventListener("change", e => {
  const t = e.target;
  if (t.name?.startsWith("model-")){
    const p = t.name.slice(6);
    if (t.value === "__custom"){
      const c = document.querySelector(`[data-custom="${p}"]`);
      cur[p + "Model"] = c?.value.trim() || cur[p + "Model"];
      setTimeout(() => c?.focus(), 0);
    } else cur[p + "Model"] = t.value;
    renderModels(p); renderFeatures();
  } else if (t.dataset.flag){
    cur.flags[t.dataset.flag] = t.checked; renderFeatures();
  }
  renderDirty();
});
root.addEventListener("click", e => {
  const pb = e.target.closest("#feat-grid .seg2 [data-prov]");
  if (pb){
    cur.prov[pb.closest("[data-feat]").dataset.feat] = pb.dataset.prov;
    renderFeatures(); renderMainProv(); renderDirty();
    return;
  }
  const mp = e.target.closest("#main-prov [data-main]");
  if (mp){
    Object.keys(cur.prov).forEach(k => { cur.prov[k] = mp.dataset.main; });
    renderFeatures(); renderMainProv(); renderDirty();
    return;
  }
  if (e.target.closest("#pf-toggle")){
    perFeature = !perFeature;
    renderFeatures(); renderMainProv();
  }
});

// ─── Завантаження / збереження ─────────────────────────────────────────────
function fromDb(s){
  const x = structuredClone(DEF);
  if (!s) return x;
  x.groqModel = s.groqModel || s.model || DEF.groqModel;
  x.geminiModel = s.geminiModel || DEF.geminiModel;
  FEATURES.forEach(f => { x.flags[f.id] = s[f.flag] !== false; x.prov[f.id] = s.featProviders?.[f.id] === "gemini" ? "gemini" : "groq"; });
  return x;
}

async function save(){
  for (const p of ["groq", "gemini"]) if (!cur[p + "Model"].trim()){ toast(`Вкажіть модель ${PROVIDERS[p].name}`, "err"); return; }
  const btns = [document.getElementById("btn-save-ai"), document.getElementById("btn-save-bar")];
  btns.forEach(b => b.disabled = true);
  try {
    await dbUpd("settings/ai", {
      groqModel: cur.groqModel.trim(), geminiModel: cur.geminiModel.trim(),
      // Сумісність зі старими читачами налаштувань
      model: hasKey("groq") ? cur.groqModel.trim() : cur.geminiModel.trim(),
      aiComments: cur.flags.comments, aiAnalysis: cur.flags.analysis, aiGeneration: cur.flags.generation, aiTextCheck: cur.flags.textcheck, aiMail: cur.flags.mail,
      featProviders: { ...cur.prov }, updatedAt: Date.now(),
    });
    const ch = [];
    if (saved.groqModel !== cur.groqModel || saved.geminiModel !== cur.geminiModel) ch.push("моделі");
    Object.keys(cur.flags).forEach(k => { if (saved.flags[k] !== cur.flags[k]) ch.push(`${k}: ${cur.flags[k] ? "увімк." : "вимк."}`); });
    if (JSON.stringify(saved.prov) !== JSON.stringify(cur.prov)) ch.push("провайдери функцій");
    logAction("ai.settings", { type: "service", label: "AI налаштування" }, ch.join(", ") || null);
    saved = structuredClone(cur);
    renderAll();
    toast("Налаштування AI збережено — діють одразу для всіх");
  } catch (e){
    toast("Помилка збереження: " + e.message, "err");
  } finally {
    renderDirty();
    document.getElementById("btn-save-bar").disabled = false;
  }
}
document.getElementById("btn-save-ai").addEventListener("click", save);
document.getElementById("btn-save-bar").addEventListener("click", save);
document.getElementById("btn-discard").addEventListener("click", () => { cur = structuredClone(saved); renderAll(); });
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s"){ e.preventDefault(); if (!same(cur, saved)) save(); }
});
addEventListener("beforeunload", e => { if (!same(cur, saved)){ e.preventDefault(); e.returnValue = ""; } });

// Викладачі з індивідуальними налаштуваннями (перекривають глобальні)
function renderOverrides(users){
  const list = Object.values(users || {}).filter(u => u && u.aiSettings);
  const box = document.getElementById("ovr");
  box.hidden = !list.length;
  if (!list.length) return;
  const n = list.length, one = n % 10 === 1 && n % 100 !== 11;
  document.getElementById("ovr-t").innerHTML = `<b>${n}</b> ${one ? "викладач має" : "викладачів мають"} індивідуальні AI-налаштування — вони перекривають перемикачі функцій вище`;
  const names = list.map(u => [u.surname, u.name].filter(Boolean).join(" ") || u.email).filter(Boolean);
  document.getElementById("ovr-names").textContent = names.slice(0, 4).join(", ") + (names.length > 4 ? ` та ще ${names.length - 4}` : "");
}

try {
  const [s, users] = await Promise.all([dbGet("settings/ai"), dbGet("users").catch(() => null)]);
  saved = fromDb(s); cur = structuredClone(saved);
  perFeature = new Set(Object.values(cur.prov)).size > 1;
  wk.viaWorker = s?.viaWorker === true;
  renderAll();
  renderOverrides(users);
} catch (e) {
  console.error("[ai-settings] load failed:", e);
  renderAll();
  toast("Не вдалося завантажити налаштування: " + e.message, "err");
}
hideLoader();

// ─── Воркер: ключі, перемикання, перевірка ─────────────────────────────────
// Ключі Groq і Gemini лежать у секретах Cloudflare. Сторінка лише показує стан і сама вмикає режим воркера.
{
  const host = document.createElement("section");
  host.id = "wk-panel"; host.className = "wk";
  host.setAttribute("aria-label", "Воркер AI");
  const head = document.querySelector("#admin-content .page-head");
  head ? head.after(host) : document.getElementById("admin-content").prepend(host);
  const ok = (v, yes, no) => `<span class="wk-st ${v ? "yes" : "no"}">${v ? yes : no}</span>`;
  let armed = false;
  async function loadStatus(){
    wk.err = ""; wk.status = null;
    try { wk.url = await mailWorkerUrl(); wk.status = await mailApi("/ai/status"); }
    catch (e){ wk.err = e.message; }
    // Є ключі у воркері, а режим воркера ще не ввімкнено — вмикаємо (лише власник)
    const st = wk.status;
    if (st && isOwner && !wk.viaWorker && (st.configured.groq || st.configured.gemini)){
      try { await dbUpd("settings/ai", { viaWorker: true, updatedAt: Date.now() }); wk.viaWorker = true; logAction("ai.worker", { type: "service", label: "AI через воркер" }, "увімкнено автоматично"); }
      catch {}
    }
    renderWk(); renderAll();
  }
  function renderWk(){
    const st = wk.status, anyKey = !!(st && (st.configured.groq || st.configured.gemini));
    const legacy = !!(st && (st.legacyKeysInDb.groq || st.legacyKeysInDb.gemini));
    host.innerHTML = `
      <div class="wk-h"><div><b>Воркер AI</b><p>Ключі зберігаються в секретах Cloudflare. Воркер сам перевіряє дозвіл і ліміт викладача та веде облік. Додати чи змінити ключ: <code>docs/ai-setup.md</code>.</p></div></div>
      ${wk.err ? `<div class="wk-err" role="alert">${esc(wk.err)}</div>` : !st ? `<div class="wk-row">Перевіряємо воркер…</div>` : `
        <div class="wk-grid">
          <div class="wk-row"><span>Режим воркера</span>${ok(wk.viaWorker, "увімкнено", "вимкнено")}</div>
          ${legacy ? `<div class="wk-row"><span>Старі ключі в базі</span>${ok(false, "", "лишились")}</div>` : ""}
        </div>
        ${!anyKey ? `<div class="wk-err" role="alert">У воркері немає жодного ключа: додайте <code>GROQ_API_KEY</code> або <code>GEMINI_API_KEY</code> у секрети Cloudflare.</div>` : ""}
        <div class="wk-acts">
          <button type="button" class="tb-btn" id="wk-test" ${anyKey ? "" : "disabled"}>Перевірити відповідь</button>
          ${isOwner && wk.viaWorker && legacy ? `<button type="button" class="tb-btn danger" id="wk-del">${armed ? "Так, видалити ключі з бази" : "Видалити старі ключі з бази"}</button>` : ""}
          <span class="wk-msg" id="wk-msg" role="status"></span>
        </div>
        ${!isOwner && legacy ? `<div class="wk-note">Видалити старі ключі з бази може лише власник.</div>` : ""}`}`;
  }
  host.addEventListener("click", async e => {
    const msg = () => document.getElementById("wk-msg");
    if (e.target.closest("#wk-test")){
      const b = e.target.closest("#wk-test"); b.disabled = true; msg().textContent = "Питаємо AI…"; msg().className = "wk-msg";
      const t0 = performance.now();
      try {
        const r = await mailApi("/ai", { feature: "mail", messages: [{ role: "user", content: "Відповідай одним словом: так" }], maxTokens: 10 });
        msg().textContent = `Відповів ${r.provider === "gemini" ? "Gemini" : "Groq"} за ${Math.round(performance.now() - t0)} мс`; msg().className = "wk-msg ok";
      } catch (err){ msg().textContent = err.message; msg().className = "wk-msg bad"; }
      b.disabled = false;
    } else if (e.target.closest("#wk-del")){
      if (!armed){ armed = true; renderWk(); setTimeout(() => { armed = false; if (document.getElementById("wk-del")) renderWk(); }, 6000); return; }
      armed = false;
      try {
        await dbUpd("settings/ai", { groqApiKey: null, geminiApiKey: null, apiKey: null, updatedAt: Date.now() });
        logAction("ai.keys.remove", { type: "service", label: "Ключі AI в базі" }, null);
        toast("Ключі з бази видалено");
      } catch (err){ toast("Помилка: " + err.message, "err"); }
      loadStatus();
    }
  });
  renderWk(); loadStatus();
}

// ─── Використання AI (aiUsage/{yyyymm}/{uid}/{feature}) ─────────────────────
{
  const { bars, rank, C } = await import("./shared/admin-charts.js?v=2");
  const FN = { comments: ["Коментарі студентам", "#7C3AED"], analysis: ["Розбір помилок", "#2563EB"], generation: ["Генерація питань", "#D97706"], textcheck: ["Перевірка відповідей", "#059669"], mail: ["Листи й розсилки", "#0891B2"] };
  const MONTHS = ["січень","лютий","березень","квітень","травень","червень","липень","серпень","вересень","жовтень","листопад","грудень"];
  const mKey = d => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}`;
  const mName = k => `${MONTHS[+k.slice(4) - 1]} ${k.slice(0, 4)}`;
  const mShort = k => MONTHS[+k.slice(4) - 1].slice(0, 3);
  const fmtN = n => Number(n || 0).toLocaleString("uk-UA");
  let usage = {}, users = {}, sel = mKey(new Date());
  try { [usage, users] = await Promise.all([dbGet("aiUsage").then(v => v || {}), dbGet("users").then(v => v || {})]); }
  catch (e) { usage = null; }
  const last6 = () => { const out = [], d = new Date(); d.setDate(1); for (let i = 5; i >= 0; i--){ const x = new Date(d.getFullYear(), d.getMonth() - i, 1); out.push(mKey(x)); } return out; };
  const sumMonth = k => {
    const t = { calls: 0, tokens: 0, errors: 0, teachers: 0, byF: {}, byU: [] };
    Object.entries(usage?.[k] || {}).forEach(([uid, fs]) => {
      const u = { uid, calls: 0, tokens: 0, errors: 0 };
      Object.entries(fs || {}).forEach(([f, v]) => {
        const b = t.byF[f] ||= { calls: 0, tokens: 0, errors: 0 };
        ["calls", "tokens", "errors"].forEach(x => { const n = Number(v?.[x]) || 0; b[x] += n; u[x] += n; t[x] += n; });
      });
      if (u.calls || u.errors){ t.teachers++; t.byU.push(u); }
    });
    return t;
  };
  const nameOf = uid => { const u = users[uid] || {}; return [u.surname, u.name].filter(Boolean).join(" ") || u.email || "Видалений викладач"; };
  function renderUsage(){
    const host = document.getElementById("ai-usage");
    const ms = last6();
    document.getElementById("us-months").innerHTML = ms.slice(-4).reverse().map(k => `<button type="button" role="tab" aria-selected="${k === sel}" class="${k === sel ? "on" : ""}" data-m="${k}">${mName(k)[0].toUpperCase() + mName(k).slice(1, -5)}</button>`).join("");
    if (usage === null){ host.innerHTML = `<div class="us-empty"><b>Не вдалося прочитати статистику</b>Опублікуйте оновлені правила бази (розділ aiUsage) у консолі Firebase.</div>`; return; }
    const t = sumMonth(sel);
    const anyData = ms.some(k => usage[k]);
    if (!anyData){ host.innerHTML = `<div class="us-empty"><b>Даних поки немає</b>Облік почнеться з першого звернення до AI після оновлення: коментарі студентам, розбір помилок, генерація питань і перевірка відповідей.</div>`; return; }
    const errPct = t.calls + t.errors ? Math.round(t.errors / (t.calls + t.errors) * 100) : 0;
    host.innerHTML = `
      <div class="us-kpis">
        <div class="us-kpi"><div class="l"><i style="background:${C.violet}"></i>Запитів</div><div class="v">${fmtN(t.calls)}</div><small>${mName(sel)}</small></div>
        <div class="us-kpi"><div class="l"><i style="background:#2563EB"></i>Токенів</div><div class="v">${fmtN(t.tokens)}</div><small>${t.calls ? "≈ " + fmtN(Math.round(t.tokens / t.calls)) + " на запит" : "—"}</small></div>
        <div class="us-kpi"><div class="l"><i style="background:#DC2626"></i>Помилок</div><div class="v">${fmtN(t.errors)}</div><small class="${errPct >= 10 ? "bad" : ""}">${errPct}% звернень</small></div>
        <div class="us-kpi"><div class="l"><i style="background:#059669"></i>Викладачів</div><div class="v">${fmtN(t.teachers)}</div><small>користувались AI</small></div>
      </div>
      <div class="us-grid" style="margin-top:14px">
        <div class="us-card"><h3>За функціями</h3><p class="s">Кількість запитів · ${mName(sel)}</p><div id="us-fn"></div></div>
        <div class="us-card"><h3>Хто використовує найбільше</h3><p class="s">Запити разом зі студентами викладача</p><div id="us-top"></div></div>
      </div>
      <div class="us-card" style="margin-top:14px"><h3>Динаміка</h3><p class="s">Запити за останні 6 місяців</p><div id="us-trend"></div></div>`;
    rank(document.getElementById("us-fn"), Object.keys(FN).map(k => ({ label: FN[k][0], sub: t.byF[k] ? `${fmtN(t.byF[k].tokens)} токенів${t.byF[k].errors ? ` · ${t.byF[k].errors} помилок` : ""}` : "", value: t.byF[k]?.calls || 0, color: FN[k][1] })), { unit: "Запитів: ", empty: "Цього місяця AI не використовувався" });
    rank(document.getElementById("us-top"), t.byU.sort((a, b) => b.calls - a.calls).slice(0, 8).map(u => ({ label: nameOf(u.uid), sub: `${fmtN(u.tokens)} токенів${u.errors ? ` · ${u.errors} помилок` : ""}`, value: u.calls })), { unit: "Запитів: ", color: C.violet, empty: "Цього місяця AI не використовувався" });
    bars(document.getElementById("us-trend"), { labels: ms.map(mShort), full: ms.map(mName), series: [{ name: "Запити", color: C.violet, values: ms.map(k => sumMonth(k).calls) }], unit: n => "запитів", height: 170, highlightLast: true });
  }
  document.getElementById("us-months").addEventListener("click", e => { const b = e.target.closest("[data-m]"); if (b){ sel = b.dataset.m; renderUsage(); } });
  renderUsage();
}
</script>
</body>
</html>
