<style>
/* ─── Page-specific styles for overview ─── */
.page-head .date{font-size:14px;color:var(--ink-500);margin-top:4px}
.page-head .date::first-letter{text-transform:uppercase}

/* Зараз на платформі */
.pulse{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:18px;background:linear-gradient(135deg,#1A1040 0%,#2E1A6B 55%,#4338CA 100%);color:#fff;box-shadow:0 18px 40px -26px rgba(76,29,149,.9);position:relative;overflow:hidden}
.pulse::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,.35),transparent 70%);pointer-events:none}
.pulse-ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18)}
.pulse-ico.live{background:rgba(34,197,94,.18);border-color:rgba(34,197,94,.4);color:#86EFAC}
.pulse-main{flex:1;min-width:0;position:relative;z-index:1}
.pulse-t{font-weight:800;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pulse-t .dot{width:8px;height:8px;border-radius:50%;background:#22C55E;animation:ovPulse 1.6s infinite}
@keyframes ovPulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.pulse-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pulse-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);color:var(--v-100);text-decoration:none;transition:background .15s}
.pulse-chip:hover{background:rgba(255,255,255,.18)}
.pulse-chip.bad{background:rgba(244,63,94,.2);border-color:rgba(244,63,94,.4);color:#FECDD3}
.pulse-chip.warn{background:rgba(245,158,11,.18);border-color:rgba(245,158,11,.38);color:var(--amb-200)}
.pulse-chip.ok{background:rgba(34,197,94,.16);border-color:rgba(34,197,94,.35);color:var(--grn-200)}
.pulse-live{position:relative;z-index:1;margin-left:auto;padding:9px 14px;border-radius:11px;background:#fff;color:#2E1A6B;font-size:13px;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:transform .15s}
.pulse-live:hover{transform:translateY(-1px)}
.pulse-live::before{content:"";width:7px;height:7px;border-radius:50%;background:#EF4444;animation:liveDot 1.4s infinite}
@keyframes liveDot{0%,100%{opacity:1}50%{opacity:.3}}
@media (max-width:640px){.pulse{flex-wrap:wrap}.pulse-live{margin-left:0;width:100%;justify-content:center}}

/* Row layouts */
.row-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.side-stack{display:flex;flex-direction:column;gap:16px}
@media (max-width:1280px){.row-2{grid-template-columns:1fr}}
.seg{display:inline-flex;background:var(--sf-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;font:inherit;font-size:12px;font-weight:700;color:var(--ink-500);padding:6px 11px;border-radius:8px;cursor:pointer}
.seg button.on{background:#fff;color:var(--v-600);box-shadow:0 1px 3px rgba(15,30,71,.12)}
.chart-sum{display:flex;flex-wrap:wrap;gap:10px 26px;margin:2px 0 18px}
.chart-sum div{display:flex;flex-direction:column;gap:3px}
.chart-sum b{font-family:"Geist Mono",monospace;font-size:20px;font-weight:800;letter-spacing:-.02em}
.chart-sum span{font-size:11px;color:var(--ink-400);font-weight:700;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.chart-sum span i{width:8px;height:8px;border-radius:2px}

/* Два режими: ігри наживо і тести */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:1100px){.modes{grid-template-columns:1fr}}
.mode{background:#fff;border:1px solid var(--line);border-radius:var(--r-xl);padding:20px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.mode::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--mc)}
.mode.games{--mc:#E11D8F;--ms:#FCE7F3;--mt:#BE185D}
.mode.tests{--mc:#2563EB;--ms:#DBEAFE;--mt:#1D4ED8}
.mode-h{display:flex;align-items:center;gap:12px}
.mode-ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--ms);color:var(--mt);flex:0 0 auto}
.mode-h h3{margin:0;font-size:16px;font-weight:800;letter-spacing:-.01em}
.mode-h p{margin:2px 0 0;font-size:12px;color:var(--ink-500)}
.mode-now{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--sf-2);color:var(--ink-500);white-space:nowrap;text-decoration:none}
.mode-now.on{background:var(--ms);color:var(--mt)}
.mode-now.on::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mc);animation:liveDot 1.4s infinite}
.mode-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.mode-stats div{display:flex;flex-direction:column;gap:4px;min-width:0}
.mode-stats b{font:800 24px "Geist Mono",monospace;letter-spacing:-.02em;line-height:1}
.mode-stats span{font-size:12px;color:var(--ink-500);font-weight:600;line-height:1.3}
.mode-foot{display:flex;align-items:center;gap:8px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-500);min-width:0}
.mode-foot b{color:var(--ink-900);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mode-foot small{margin-left:auto;font-family:"Geist Mono",monospace;font-size:12px;white-space:nowrap}
@media (max-width:640px){.mode-stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.mode{padding:16px}}

/* KPI */
a.kpi{text-decoration:none;color:inherit;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
a.kpi:hover{transform:translateY(-2px);border-color:var(--line-strong);box-shadow:var(--shadow)}
.kpi-s b{color:var(--ink-700)}
.kpi .kpi-row{gap:12px}
.kpi .kpi-v{font-size:28px}

/* Нові проблеми */
.prob{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.prob:first-child{border-top:0;padding-top:0}
.prob-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;background:var(--red-100);color:var(--red-700)}
.prob-ico.imp{background:var(--v-100);color:var(--v-600)}
.prob-b{flex:1;min-width:0}
.prob-t{font-size:13px;font-weight:600;color:var(--ink-900);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prob-m{font-size:12px;color:var(--ink-400);margin-top:3px;display:flex;gap:6px;white-space:nowrap;overflow:hidden}
.prob-m span+span::before{content:"·";margin-right:6px}
.prob:hover .prob-t{color:var(--v-600)}
.ok-state{display:flex;align-items:center;gap:10px;padding:6px 0;color:var(--grn-700);font-size:13px;font-weight:600}
.ok-state span{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--grn-100)}
.card-link{font-size:12px;font-weight:700;color:var(--v-600);text-decoration:none;white-space:nowrap}
.card-link:hover{text-decoration:underline}

</style>

<script type="module">
import { initAdminShell, loadAllTeachers, cachedTeachers, esc, formatTimeAgo, dbGet, toast, hideLoader } from "./shared/admin-shell.js?v=22";
import { bars, C } from "./shared/admin-charts.js?v=2";

const DAY = 864e5;
// Відмінювання: plural(5, ["викладач","викладачі","викладачів"])
const plural = (n, f) => { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? f[2] : b === 1 ? f[0] : b >= 2 && b <= 4 ? f[1] : f[2]; };
const dayStart = t => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const fullName = u => [u.name, u.surname].filter(Boolean).join(" ") || u.email || "—";
const gradeTone = g => g >= 10 ? "ok" : g >= 4 ? "mid" : "bad";

const I = p => `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICO = {
  teachers: I('<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M15 20c0-2.6 2-4.8 4.5-5"/>'),
  doc:      I('<path d="M14 3v5h5"/><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M9 13h6M9 17h4"/>'),
  users:    I('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>'),
  pulse:    I('<path d="M3 12h4l3-9 4 18 3-9h4"/>'),
  game:     I('<rect x="2" y="6" width="20" height="12" rx="4"/><path d="M7 10v4M5 12h4"/><circle cx="15.5" cy="11" r="1" fill="currentColor"/><circle cx="18" cy="13.5" r="1" fill="currentColor"/>'),
  bug:      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>',
  idea:     '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>',
  check:    '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
};

const content = `
  <div class="page-head">
    <div>
      <h1 id="ov-greet">&nbsp;</h1>
      <div class="date" id="ov-date"></div>
    </div>
  </div>

  <!-- Що відбувається зараз -->
  <section class="pulse" id="ov-pulse">
    <div class="pulse-ico" id="pulse-ico">${ICO.pulse}</div>
    <div class="pulse-main">
      <div class="pulse-t" id="pulse-t">Завантаження даних платформи…</div>
      <div class="pulse-chips" id="pulse-chips"></div>
    </div>
    <a href="https://app.quizflow.space/live" target="_blank" rel="noopener" class="pulse-live">Live-моніторинг</a>
  </section>

  <!-- Два режими: ігри наживо і тести за посиланням -->
  <div class="modes">
    <section class="mode games" id="mode-games"></section>
    <section class="mode tests" id="mode-tests"></section>
  </div>

  <div class="kpi-grid" id="kpi-grid"></div>

  <div>
      <section class="card">
        <div class="card-h">
          <div>
            <h3>Нові проблеми</h3>
            <div class="sub" id="prob-sub">—</div>
          </div>
          <a class="card-link" href="problems">Усі →</a>
        </div>
        <div id="prob-list"></div>
      </section>
  </div>
`;

const topbarRight = `
  <button class="tb-btn" id="btn-refresh" type="button">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 13.7-5.7L20 8"/><path d="M20 4v4h-4"/><path d="M20 12a8 8 0 0 1-13.7 5.7L4 16"/><path d="M4 20v-4h4"/></svg>
    Оновити
  </button>
  <a class="tb-btn primary" href="teachers">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    Новий викладач
  </a>
`;

const { _user } = await initAdminShell({ activeId: "overview", crumbs: ["Огляд"], content, topbarRight });

{
  const h = new Date().getHours();
  const greeting = h < 5 ? "Доброї ночі" : h < 12 ? "Доброго ранку" : h < 18 ? "Добрий день" : "Добрий вечір";
  const first = (_user.name || "").split(" ")[0];
  document.getElementById("ov-greet").textContent = greeting + (first ? ", " + first : "");
  document.getElementById("ov-date").textContent = "Огляд платформи · " + new Date().toLocaleDateString("uk-UA", { weekday: "long", day: "numeric", month: "long" });
}

// ─── Дані ────────────────────────────────────────────────────────────────────
let D = { users: [], stats: {}, attempts: [], games: [], live: [], problems: [] };

function apply({ _users, _stats, _allAttempts, _allGames, _liveNow }, bugs){
  // Середня оцінка по викладачу — з уже завантажених спроб
  const g = {};
  _allAttempts.forEach(a => { if (a.grade12 == null || a.status === "in_progress") return; (g[a.teacherId] ||= []).push(+a.grade12); });
  _users.forEach(u => { const arr = g[u.id]; if (_stats[u.id]) _stats[u.id].avg = arr?.length ? arr.reduce((s, x) => s + x, 0) / arr.length : null; });
  _users.forEach(u => { const s = _stats[u.id]; if (s) s.week = (s.weekAttempts || 0) + (s.weekGames || 0); });
  D = {
    users: _users, stats: _stats, attempts: _allAttempts, games: _allGames || [], live: _liveNow || [],
    problems: bugs === null ? null : bugs ? Object.entries(bugs).map(([id, v]) => ({ id, ...v })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)) : [],
  };
  renderAll();
}
let _bugs = null;
async function reload(){
  const [d, bugs] = await Promise.all([loadAllTeachers(), dbGet("bugReports").catch(() => null)]);
  _bugs = bugs;
  apply(d, bugs || {});
}

// Сума по днях за останні n днів: list — масив, when(x) — час, w(x) — вага (1 або к-сть гравців)
function perDay(n, list = D.attempts, when = a => a.createdAt, w = () => 1){
  const start = dayStart(Date.now()) - (n - 1) * DAY;
  const out = new Array(n).fill(0);
  list.forEach(x => { const t = when(x); if (!t || t < start) return; const i = Math.floor((t - start) / DAY); if (i >= 0 && i < n) out[i] += w(x); });
  return out;
}
const dayLabels = n => { const start = dayStart(Date.now()) - (n - 1) * DAY, WD = ["Нд", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
  return { short: Array.from({ length: n }, (_, i) => { const d = new Date(start + i * DAY); return n <= 7 ? WD[d.getDay()] : d.getDate() + "." + String(d.getMonth() + 1).padStart(2, "0"); }),
    full: Array.from({ length: n }, (_, i) => new Date(start + i * DAY).toLocaleDateString("uk-UA", { weekday: "short", day: "numeric", month: "long" })) }; };
function renderAll(){
  renderPulse();
  renderModes();
  renderKpis();
  renderProblems();
}

function renderPulse(){
  const nowT = Date.now();
  const testing = D.attempts.filter(a => a.status === "in_progress" && nowT - (a.lastSeen || a.startedAt || a.createdAt || 0) < 10 * 60e3).length;
  const games = D.live.length, players = D.live.reduce((s, r) => s + (r.players || 0), 0);
  const newProb = (D.problems || []).filter(p => p.status === "new").length;
  const first = D.users.filter(u => u.isFirstLogin && !u.blocked).length;
  const parts = [];
  if (games) parts.push(`${games} ${plural(games, ["гра", "гри", "ігор"])} наживо${players ? ` · ${players} ${plural(players, ["гравець", "гравці", "гравців"])}` : ""}`);
  if (testing) parts.push(`${testing} ${plural(testing, ["учень проходить", "учні проходять", "учнів проходять"])} тест`);
  document.getElementById("pulse-ico").classList.toggle("live", !!(games || testing));
  document.getElementById("pulse-t").innerHTML = parts.length ? `<span class="dot"></span>Зараз: ${esc(parts.join(" · "))}` : "Зараз на платформі тихо: ні ігор, ні тестів у процесі";
  const chips = [];
  if (newProb) chips.push(`<a class="pulse-chip bad" href="problems">${newProb} ${plural(newProb, ["нова проблема", "нові проблеми", "нових проблем"])}</a>`);
  if (first) chips.push(`<a class="pulse-chip warn" href="teachers">${first} ${plural(first, ["викладач ще не увійшов", "викладачі ще не увійшли", "викладачів ще не увійшли"])}</a>`);
  if (!chips.length && D.problems) chips.push(`<span class="pulse-chip ok">Проблем і незавершених запрошень немає</span>`);
  document.getElementById("pulse-chips").innerHTML = chips.join("");
}

// Картки двох режимів: останні 30 днів + міні-графік за 14 днів
function renderModes(){
  const nowT = Date.now(), from = nowT - 30 * DAY;
  const L = dayLabels(14);
  const top = (arr, key) => { const m = new Map(); arr.forEach(x => { const k = key(x); if (k) m.set(k, (m.get(k) || 0) + 1); }); return [...m].sort((a, b) => b[1] - a[1])[0]; };

  // Ігри
  const g30 = D.games.filter(g => g.playedAt >= from);
  const pl = g30.reduce((s, g) => s + g.players, 0);
  const hosts = new Set(g30.map(g => g.teacherId)).size;
  const tg = top(g30, g => g.title);
  const liveN = D.live.length;
  document.getElementById("mode-games").innerHTML = `
    <div class="mode-h"><span class="mode-ico">${ICO.game}</span><div><h3>Ігри наживо</h3><p>Вікторини на уроці · останні 30 днів</p></div>
      <a class="mode-now${liveN ? " on" : ""}" href="https://app.quizflow.space/live" target="_blank" rel="noopener">${liveN ? `${liveN} ${plural(liveN, ["гра", "гри", "ігор"])} зараз` : "Зараз немає"}</a></div>
    <div class="mode-stats">
      <div><b>${g30.length}</b><span>${plural(g30.length, ["гра", "гри", "ігор"])}</span></div>
      <div><b>${pl}</b><span>${plural(pl, ["учасник", "учасники", "учасників"])}</span></div>
      <div><b>${g30.length ? Math.round(pl / g30.length) : "—"}</b><span>гравців на гру</span></div>
      <div><b>${hosts}</b><span>${plural(hosts, ["викладач проводив", "викладачі проводили", "викладачів проводили"])}</span></div>
    </div>
    <div id="mini-games"></div>
    <div class="mode-foot">${tg ? `Найчастіше грали:<b>${esc(tg[0])}</b><small>${tg[1]} ${plural(tg[1], ["раз", "рази", "разів"])}</small>` : `За 30 днів ігор не було`}</div>`;
  bars(document.getElementById("mini-games"), { compact: true, labels: L.short, full: L.full, series: [{ name: "Ігор", color: C.games, values: perDay(14, D.games, g => g.playedAt) }] });

  // Тести
  const a30 = D.attempts.filter(a => (a.createdAt || 0) >= from);
  const graded = a30.filter(a => a.grade12 != null && a.status !== "in_progress").map(a => +a.grade12);
  const avg = graded.length ? graded.reduce((s, x) => s + x, 0) / graded.length : null;
  const pass = graded.length ? Math.round(graded.filter(x => x >= 4).length / graded.length * 100) : null;
  const pend = D.attempts.filter(a => a.status === "pending_review").length;
  const testing = D.attempts.filter(a => a.status === "in_progress" && nowT - (a.lastSeen || a.startedAt || a.createdAt || 0) < 10 * 60e3).length;
  const tt = top(a30, a => a.testTitle || null) || top(a30, a => a.teacherName);
  document.getElementById("mode-tests").innerHTML = `
    <div class="mode-h"><span class="mode-ico">${ICO.doc}</span><div><h3>Тести за посиланням</h3><p>Самостійні й контрольні · останні 30 днів</p></div>
      <span class="mode-now${testing ? " on" : ""}">${testing ? `${testing} проходять зараз` : "Зараз ніхто"}</span></div>
    <div class="mode-stats">
      <div><b>${a30.length}</b><span>${plural(a30.length, ["спроба", "спроби", "спроб"])}</span></div>
      <div><b>${avg != null ? avg.toFixed(1) : "—"}</b><span>середня оцінка</span></div>
      <div><b>${pass != null ? pass + "%" : "—"}</b><span>склали (≥ 4)</span></div>
      <div><b>${pend}</b><span>чекають перевірки</span></div>
    </div>
    <div id="mini-tests"></div>
    <div class="mode-foot">${tt ? `${a30.some(a => a.testTitle) ? "Найактивніший тест:" : "Найбільше спроб у:"}<b>${esc(tt[0])}</b><small>${tt[1]} ${plural(tt[1], ["спроба", "спроби", "спроб"])}</small>` : `За 30 днів спроб не було`}</div>`;
  bars(document.getElementById("mini-tests"), { compact: true, labels: L.short, full: L.full, series: [{ name: "Спроб", color: C.tests, values: perDay(14) }] });
}

function renderKpis(){
  const u = D.users, active = u.filter(x => !x.blocked), blocked = u.length - active.length, first = u.filter(x => x.isFirstLogin && !x.blocked).length;
  let tests = 0, pub = 0, students = 0;
  u.forEach(x => { const s = D.stats[x.id] || {}; tests += s.tests || 0; pub += s.activeTests || 0; students += s.students || 0; });
  const players = D.games.reduce((s, g) => s + g.players, 0);
  const K = [
    { k: "violet", ico: ICO.teachers, v: u.length, l: plural(u.length, ["Викладач", "Викладачі", "Викладачів"]), href: "teachers",
      s: [`<b>${active.length - first}</b> ${plural(active.length - first, ["активний", "активні", "активних"])}`, first ? `<b>${first}</b> не увійшли` : "", blocked ? `<b>${blocked}</b> заблок.` : ""].filter(Boolean).join(" · ") },
    { k: "blue", ico: ICO.doc, v: tests, l: plural(tests, ["Тест у базі", "Тести в базі", "Тестів у базі"]), href: "stats", s: `<b>${pub}</b> ${plural(pub, ["активний", "активні", "активних"])}` },
    { k: "pink", ico: ICO.game, v: D.games.length, l: plural(D.games.length, ["Гра", "Гри", "Ігор"]) + " усього", href: "stats", s: `<b>${players}</b> ${plural(players, ["участь", "участі", "участей"])} учнів` },
    { k: "green", ico: ICO.users, v: students, l: plural(students, ["Студент", "Студенти", "Студентів"]), href: "stats",
      s: `<b>${D.attempts.length}</b> ${plural(D.attempts.length, ["спроба", "спроби", "спроб"])} тестів` },
  ];
  document.getElementById("kpi-grid").innerHTML = K.map(k => `
    <a class="kpi ${k.k}" href="${k.href}">
      <div class="kpi-row"><div class="kpi-ico">${k.ico}</div><div class="kpi-v">${k.v}</div></div>
      <div class="kpi-l">${esc(k.l)}</div>
      <div class="kpi-s">${k.s}</div>
    </a>`).join("");
}

function renderProblems(){
  if (!D.problems){ document.getElementById("prob-sub").textContent = "Завантаження…"; document.getElementById("prob-list").innerHTML = ""; return; }
  const fresh = D.problems.filter(p => p.status === "new");
  document.getElementById("prob-sub").textContent = fresh.length
    ? `${fresh.length} ${plural(fresh.length, ["очікує", "очікують", "очікують"])} на розгляд`
    : "Усі звернення розглянуто";
  document.getElementById("prob-list").innerHTML = fresh.length
    ? fresh.slice(0, 3).map(p => {
        const imp = p.reportType === "improvement";
        return `<a class="prob" href="problems">
          <span class="prob-ico${imp ? " imp" : ""}" title="${imp ? "Покращення" : "Проблема"}">${imp ? ICO.idea : ICO.bug}</span>
          <span class="prob-b">
            <span class="prob-t">${esc(p.message || "Без опису")}</span>
            <span class="prob-m"><span>${esc(p.userName || "—")}</span>${p.page ? `<span>${esc(p.page)}</span>` : ""}<span>${esc(formatTimeAgo(p.createdAt))}</span></span>
          </span>
        </a>`;
      }).join("")
    : `<div class="ok-state"><span>${ICO.check}</span>Нових звернень немає</div>`;
}

// ─── Обробники ────────────────────────────────────────────────────────────
// Підписи осей залежать від ширини — перемальовуємо графіки після зміни розміру
let _rsT, _rsW = innerWidth;
addEventListener("resize", () => { clearTimeout(_rsT); _rsT = setTimeout(() => { if (Math.abs(innerWidth - _rsW) < 40) return; _rsW = innerWidth; renderModes(); }, 200); });
document.getElementById("btn-refresh").addEventListener("click", async () => {
  const btn = document.getElementById("btn-refresh");
  btn.disabled = true; btn.style.opacity = "0.5";
  try { await reload(); toast("Дані оновлено"); } catch (e) { toast("Не вдалося оновити: " + (e.message || e)); }
  btn.disabled = false; btn.style.opacity = "";
});

// First load — тримаємо loader доки дані не завантажаться
// Збережені дані — одразу, свіжі — у фоні (без повторного лоадера)
const _cached = cachedTeachers();
if (_cached){ apply(_cached, null); hideLoader(); }
try {
  await reload();
} catch (e) {
  console.error("[overview] Initial load failed:", e);
  const root = document.getElementById("admin-content");
  if (root){
    const errBox = document.createElement("div");
    errBox.className = "card";
    errBox.style.padding = "40px 24px";
    errBox.style.textAlign = "center";
    errBox.innerHTML = `
      <div style="width:54px;height:54px;margin:0 auto 14px;border-radius:14px;background:#FEE2E2;color:#B91C1C;display:grid;place-items:center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><circle cx="12" cy="16" r=".8" fill="currentColor"/></svg>
      </div>
      <div style="font-size:16px;font-weight:800;margin-bottom:6px">Не вдалося завантажити дані</div>
      <div style="font-size:13px;color:var(--ink-500);margin-bottom:14px">${e.message || "Невідома помилка"}</div>
      <button class="tb-btn primary" onclick="location.reload()">Спробувати знову</button>`;
    root.appendChild(errBox);
  }
}
hideLoader();
</script>
</body>
